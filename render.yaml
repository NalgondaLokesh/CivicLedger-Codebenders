services:
  - type: web
    name: civicledger-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: civicledger
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: civicledger_schemes
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://frontend-e6hc2jjzg-lokis-projects-d24866c8.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
